<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Seguro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2e; color: white; text-align: center; padding: 50px 20px; }
        
        /* Estilos del Login */
        .caja-login { background-color: #2f3542; padding: 40px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        input[type="password"] { padding: 15px; font-size: 18px; border-radius: 8px; border: none; outline: none; margin-bottom: 20px; width: 80%; text-align: center;}
        .btn-entrar { background-color: #3742fa; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold;}
        
        /* Estilos de las Macros */
        .boton-macro { background-color: #ff4757; color: white; border: none; border-radius: 15px; padding: 30px 40px; font-size: 24px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; margin: 10px; }
        .boton-macro:active { transform: scale(0.95); }
        
        #estado { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="pantalla-login" class="caja-login">
        <h2>🔒 Acceso Restringido</h2>
        <input type="password" id="input-pass" placeholder="Ingresa tu contraseña">
        <br>
        <button class="btn-entrar" onclick="iniciarSesion()">Desbloquear</button>
        <div id="estado-login" style="margin-top: 15px; color: #ff4757;"></div>
    </div>

    <!-- PANTALLA DE BOTONES (Oculta por defecto) -->
    <div id="pantalla-macros" style="display: none;">
        <h1>🎮 Panel de Macros</h1>
        
        <button class="boton-macro" onclick="enviarSenal('f9')">🔥 Presionar F9</button>
        <button class="boton-macro" style="background-color: #3742fa;" onclick="enviarSenal('1')">⚡ Presionar 1</button>
        
        <div id="estado">Sistema Listo</div>
        
        <!-- Contenedor de la pantalla -->
        <div id="contenedor-pantalla" style="margin-top: 30px; border: 2px solid #3742fa; border-radius: 10px; padding: 10px; display: inline-block; background-color: #000; width: 100%; max-width: 600px;">
            <h3 style="margin-top: 0;">📺 Transmisión en Vivo (Stream)</h3>
            <img id="imagen-pantalla" src="" alt="Pantalla" style="width: 100%; border-radius: 5px; opacity: 0.5;">
            <p style="font-size: 12px; color: #a4b0be;">(La pantalla se transmite en tiempo real)</p>
        </div>

        <!-- Botón para cerrar sesión -->
        <br><br>
        <button onclick="cerrarSesion()" style="background: none; color: #a4b0be; border: 1px solid #a4b0be; padding: 10px; border-radius: 5px; cursor: pointer;">Cerrar Sesión</button>
    </div>

    <script>
        // AQUÍ PONES TU URL DE NGROK (Pero SIN la contraseña)
        const urlNgrok = "https://backtalk-aluminum-diaphragm.ngrok-free.dev";
        
        // Variable que guardará la contraseña solo mientras la página esté abierta
        let tokenActivo = "";

        function iniciarSesion() {
            const passIngresada = document.getElementById('input-pass').value;
            const estadoLogin = document.getElementById('estado-login');
            estadoLogin.innerText = "Verificando...";
            estadoLogin.style.color = "yellow";

            // Intentamos hacer un "Ping" al servidor usando la contraseña que escribió el usuario
            fetch(`${urlNgrok}/ping?token=${passIngresada}`, {
                method: 'GET',
                headers: { 'ngrok-skip-browser-warning': 'true' }
            })
            .then(response => {
                if (response.ok) {
                    // Si el servidor dice OK, guardamos la contraseña y mostramos los botones
                    tokenActivo = passIngresada;
                    document.getElementById('pantalla-login').style.display = 'none';
                    document.getElementById('pantalla-macros').style.display = 'block';
                } else {
                    estadoLogin.innerText = "❌ Contraseña incorrecta.";
                    estadoLogin.style.color = "#ff4757";
                }
            })
            .catch(error => {
                estadoLogin.innerText = "🔌 Error de conexión con el Servidor.";
                estadoLogin.style.color = "#ff4757";
            });
        }

        function enviarSenal(tecla) {
            const estadoDiv = document.getElementById('estado');
            estadoDiv.innerText = `Enviando ${tecla}...`;
            
            // Usamos el tokenActivo que se validó en el Login
            fetch(`${urlNgrok}/presionar/${tecla}?token=${tokenActivo}`, {
                method: 'GET',
                headers: { 'ngrok-skip-browser-warning': 'true' }
            })
            .then(response => {
                if (response.ok) {
                    estadoDiv.innerText = `✅ ¡Tecla ${tecla.toUpperCase()} ejecutada!`;
                    estadoDiv.style.color = "#7bed9f";
                } else {
                    estadoDiv.innerText = `❌ Sesión inválida.`;
                    cerrarSesion();
                }
            })
            .catch(error => console.error("Error:", error));
        }

        let intervaloPantalla = null;

        function actualizarPantallaFetch() {
            if (!tokenActivo) return;
            
            // Usamos fetch en lugar de <img> directamente para poder enviar el header de Ngrok
            fetch(`${urlNgrok}/captura?token=${tokenActivo}&t=${new Date().getTime()}`, {
                method: 'GET',
                headers: { 'ngrok-skip-browser-warning': 'true' }
            })
            .then(response => {
                if (!response.ok) throw new Error('Error al obtener captura');
                return response.blob();
            })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const img = document.getElementById('imagen-pantalla');
                
                // Liberar memoria de la imagen anterior
                if (img.dataset.blobUrl) {
                    URL.revokeObjectURL(img.dataset.blobUrl);
                }
                
                img.src = url;
                img.dataset.blobUrl = url;
                img.style.opacity = 1;
            })
            .catch(err => console.error("Error en stream:", err));
        }

        function cerrarSesion() {
            tokenActivo = "";
            document.getElementById('input-pass').value = "";
            document.getElementById('estado-login').innerText = "";
            document.getElementById('pantalla-macros').style.display = 'none';
            document.getElementById('pantalla-login').style.display = 'inline-block';
            
            if (intervaloPantalla) {
                clearInterval(intervaloPantalla);
                intervaloPantalla = null;
            }
            document.getElementById('imagen-pantalla').src = "";
        }

        // Modificamos iniciarSesion para arrancar la transmisión por fetch
        const btnEntrar = document.querySelector('.btn-entrar');
        const oldIniciarSesion = iniciarSesion;
        iniciarSesion = function() {
            oldIniciarSesion();
            // Esperamos un poco a que se valide y si hay token iniciamos
            setTimeout(() => {
                if (tokenActivo) {
                    actualizarPantallaFetch();
                    // Actualizamos cada 500ms (medio segundo) para que se vea como video fluido
                    intervaloPantalla = setInterval(actualizarPantallaFetch, 500); 
                }
            }, 1000);
        }
    </script>
</body>
</html>
