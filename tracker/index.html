<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO Box Opener Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script>
  // ======================================================
  // CONFIGURACIÓN DE SERVIDOR
  // Cambia IMG_BASE si mueves las imágenes a otro servidor
  // ======================================================
  const GIST_ID  = '232d0bb34f0ad621b7afa175eee85b8d';
  const IMG_BASE = 'https://rolawiki.org/tracker/data';

  // ======================================================
  // DICCIONARIO DE NOMBRES PERSONALIZADOS PARA ÍTEMS
  // Agrega aquí el ID del ítem y el nombre que quieres mostrar
  // ======================================================
  const ITEM_NAMES = {
    '101364': 'OSAD Refine Hammer',
    '107572': 'Helm of Faith II Box',
    '100742': 'Primordial Weapon Box',
    '420261': 'Glastheim Looker',
    '19101': 'Glastheim Spectator',
    '107570': 'Helm of Faith Box',
    '7925': 'Powerful Dimensional Essence',
    '101077': 'Vivatus Weapon Refine Hammer',
    '100750': 'High Refine Envelope',
    '470204': 'Decadent Boots [1]'
  };

  function getItemName(itemId, defaultName) {
    return ITEM_NAMES[itemId] || defaultName;
  }
</script>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --dark: #07090e;
    --panel: rgba(13, 16, 27, 0.94);
    --border: rgba(180, 140, 60, 0.35);
    --jackpot: #ff9020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    font-family: 'Inter', sans-serif;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-image: 
      radial-gradient(circle at 50% 30%, rgba(120, 80, 40, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 50% 80%, rgba(40, 60, 120, 0.12) 0%, transparent 60%);
  }

  /* MAIN CARD */
  .tracker-card {
    width: 100%;
    max-width: 500px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(180,140,60,0.05);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    backdrop-filter: blur(10px);
    position: relative;
  }

  /* BOX HEADER */
  .box-header {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid rgba(180,140,60,0.2);
    padding-bottom: 20px;
  }
  .box-thumb {
    width: 64px; height: 64px;
    object-fit: contain;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--border);
    padding: 4px;
    image-rendering: pixelated;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .box-info { flex: 1; }
  .box-title-label {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .box-name {
    font-size: 1.3rem;
    color: #fff;
    font-weight: 600;
    line-height: 1.2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .box-total { font-size: 0.9rem; color: #888; margin-top: 4px; }
  .box-total span {
    color: var(--jackpot);
    font-weight: 700;
    font-size: 1.15rem;
    font-family: monospace;
    text-shadow: 0 0 10px rgba(255,144,32,0.3);
  }

  /* DROPS LIST */
  .drop-list-container { display: flex; flex-direction: column; gap: 8px; }
  .list-title {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .drop-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .drop-list::-webkit-scrollbar { width: 4px; }
  .drop-list::-webkit-scrollbar-track { background: transparent; }
  .drop-list::-webkit-scrollbar-thumb { background: rgba(180,140,60,0.3); border-radius: 4px; }

  /* DROP ROW */
  .drop-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.04);
    transition: 0.2s ease;
    cursor: pointer;
    user-select: none;
  }
  .drop-item:hover {
    border-color: rgba(201,168,76,0.4);
    background: rgba(201,168,76,0.05);
    transform: translateX(3px);
  }
  .drop-item:hover .drop-name { color: var(--gold-light); }
  .drop-img {
    width: 32px; height: 32px;
    object-fit: contain;
    flex-shrink: 0;
    image-rendering: pixelated;
  }
  .drop-img-err {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: #666;
  }
  .drop-text { flex: 1; min-width: 0; }
  .drop-name {
    font-size: 0.85rem;
    color: #ddd;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s;
  }
  .drop-hint {
    font-size: 0.62rem;
    color: #444;
    margin-top: 1px;
    font-style: italic;
  }
  .drop-count {
    font-family: monospace;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--jackpot);
    min-width: 25px;
    text-align: right;
  }

  /* ===================== FLOATING LAST DROP PANEL ===================== */
  .last-drop-float {
    position: fixed;
    top: 28px;
    right: 28px;
    z-index: 50;
    background: rgba(11, 14, 24, 0.96);
    border: 1px solid rgba(180,140,60,0.4);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 20px rgba(201,168,76,0.08);
    backdrop-filter: blur(14px);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 140px;
    max-width: 170px;
    opacity: 0;
    transform: translateY(-12px) scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }
  .last-drop-float.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .last-drop-float.pop {
    animation: ldf-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes ldf-pop {
    0%   { transform: scale(0.88); }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .ldf-label {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
    align-self: flex-start;
  }
  .ldf-img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    image-rendering: pixelated;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(180,140,60,0.3);
    padding: 5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 16px rgba(201,168,76,0.1);
  }
  .ldf-item-name {
    font-size: 0.78rem;
    color: #fff;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    word-break: break-word;
  }
  .ldf-divider {
    width: 100%;
    height: 1px;
    background: rgba(180,140,60,0.15);
  }
  .ldf-holder-label {
    font-size: 0.6rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    align-self: flex-start;
  }
  .ldf-holder-name {
    font-size: 0.88rem;
    color: var(--jackpot);
    font-weight: 700;
    text-align: center;
    word-break: break-word;
    text-shadow: 0 0 10px rgba(255,144,32,0.3);
  }
  .drop-bar {
    height: 3px;
    background: rgba(255,144,32,0.1);
    border-radius: 2px;
    margin-top: 4px;
    width: 100%;
  }
  .drop-bar-fill {
    height: 100%;
    background: var(--jackpot);
    border-radius: 2px;
    transition: 0.4s ease;
  }
  .no-drops {
    font-size: 0.8rem;
    color: #555;
    text-align: center;
    padding: 40px 10px;
    line-height: 1.6;
  }

  /* FOOTER */
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    border-top: 1px solid rgba(180,140,60,0.12);
    padding-top: 16px;
  }
  .status-group { display: flex; align-items: center; gap: 8px; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    transition: 0.4s;
  }
  .status-dot.on { background: #50ff80; box-shadow: 0 0 8px #50ff80; }
  .status-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }

  /* ===================== MODAL ===================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,5,10,0.82);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .modal-card {
    width: 90%;
    max-width: 420px;
    max-height: 80vh;
    background: rgba(11, 14, 24, 0.98);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    transform: translateY(16px) scale(0.97);
    transition: transform 0.25s ease;
  }
  .modal-overlay.active .modal-card {
    transform: translateY(0) scale(1);
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(180,140,60,0.15);
    flex-shrink: 0;
  }
  .modal-item-img {
    width: 36px; height: 36px;
    object-fit: contain;
    image-rendering: pixelated;
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(180,140,60,0.2);
    padding: 3px;
  }
  .modal-titles { flex: 1; min-width: 0; }
  .modal-item-name {
    font-size: 1rem;
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .modal-item-sub {
    font-size: 0.7rem;
    color: #666;
    margin-top: 2px;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: #555;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
    padding: 4px;
  }
  .modal-close:hover { color: #aaa; }
  .modal-body {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-thumb { background: rgba(180,140,60,0.2); border-radius: 4px; }
  .holder-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.15s;
  }
  .holder-row:last-child { border-bottom: none; }
  .holder-row:hover { background: rgba(255,255,255,0.02); }
  .holder-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    color: #ddd;
  }
  .holder-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--gold);
    flex-shrink: 0;
    font-weight: 700;
  }
  .holder-time {
    font-size: 0.72rem;
    color: #555;
    font-family: monospace;
    white-space: nowrap;
  }
  .modal-empty {
    font-size: 0.8rem;
    color: #444;
    text-align: center;
    padding: 30px 20px;
  }
  .modal-summary {
    font-size: 0.72rem;
    color: #888;
    text-align: center;
    padding: 10px 20px;
    border-top: 1px solid rgba(255,255,255,0.03);
    flex-shrink: 0;
  }
  .modal-summary span { color: var(--jackpot); font-weight: 700; }
</style>
</head>
<body>

<!-- TRACKER CARD -->
<div class="tracker-card">
  <div class="box-header">
    <img class="box-thumb" id="box-thumb"
      src=""
      onerror="this.style.display='none'"
      alt="Caja">
    <div class="box-info">
      <div class="box-title-label">Item Abierto</div>
      <div class="box-name" id="box-name">Constellation Oval Artifact</div>
      <div class="box-total">Aperturas: <span id="box-total">0</span></div>
    </div>
  </div>

  <div class="drop-list-container">
    <div class="list-title">Objetos Obtenidos</div>
    <div class="drop-list" id="drop-list">
      <div class="no-drops" id="no-drops">Esperando drops del juego...</div>
    </div>
  </div>

  <div class="card-footer">
    <div class="status-group">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-label" id="status-text">Buscando...</div>
    </div>
  </div>
</div>

<!-- FLOATING LAST DROP PANEL -->
<div class="last-drop-float" id="last-drop-float">
  <div class="ldf-label">Último Drop</div>
  <img class="ldf-img" id="ldf-img" src="" onerror="this.style.opacity='0.2'" alt="">
  <div class="ldf-item-name" id="ldf-item-name">—</div>
  <div class="ldf-divider"></div>
  <div class="ldf-holder-label">Obtenido por</div>
  <div class="ldf-holder-name" id="ldf-holder-name">—</div>
</div>

<!-- MODAL: LISTA DE PERSONAJES -->
<div class="modal-overlay" id="holders-modal" onclick="handleOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <img class="modal-item-img" id="modal-item-img" src="" onerror="this.style.opacity='0.3'" alt="">
      <div class="modal-titles">
        <div class="modal-item-name" id="modal-item-name">—</div>
        <div class="modal-item-sub" id="modal-item-sub">Personajes que obtuvieron este ítem</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="modal-empty">Sin datos</div>
    </div>
    <div class="modal-summary" id="modal-summary"></div>
  </div>
</div>

<script>
  const dotEl    = document.getElementById('status-dot');
  const statusTx = document.getElementById('status-text');
  const listEl   = document.getElementById('drop-list');
  const noEl     = document.getElementById('no-drops');
  const totalEl  = document.getElementById('box-total');

  // Establecer imagen del huevo principal
  document.getElementById('box-thumb').src = `${IMG_BASE}/107756.png`;

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // === RENDER BOX TRACKER ===
  function renderBoxTracker(data) {
    totalEl.textContent = data.total || 0;
    // items puede ser un array (API) o un objeto (JSON crudo del Gist)
    let items = data.items || [];
    if (!Array.isArray(items)) {
      items = Object.values(items).sort((a, b) => (b.count || 0) - (a.count || 0));
    }

    if (items.length === 0) {
      listEl.innerHTML = '';
      listEl.appendChild(noEl);
      return;
    }

    const maxCount = items[0]?.count || 1;
    listEl.innerHTML = '';

    items.forEach(item => {
      const pct     = Math.round((item.count / maxCount) * 100);
      const img     = `${IMG_BASE}/${item.item_id}.png`;
      const holders = item.holders || [];
      const displayName = getItemName(item.item_id, item.name);

      const row = document.createElement('div');
      row.className = 'drop-item';
      row.title     = 'Click para ver quién lo obtuvo';
      row.onclick   = () => showHolders(item.item_id, displayName, img, holders);

      row.innerHTML = `
        <img class="drop-img" src="${img}"
          onerror="this.outerHTML='<div class=drop-img-err>?</div>'">
        <div class="drop-text">
          <div class="drop-name">${esc(displayName)}</div>
          <div class="drop-hint">Click para ver personajes →</div>
          <div class="drop-bar"><div class="drop-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="drop-count">${item.count}</div>`;
      listEl.appendChild(row);
    });

    // === Actualizar panel flotante con el drop más reciente ===
    updateLastDropFloat(items);
  }

  function updateLastDropFloat(items) {
    // Buscar el holder más reciente entre todos los ítems
    let latestHolder = null;
    let latestItem   = null;
    let latestTime   = '';

    items.forEach(item => {
      const holders = item.holders || [];
      if (holders.length > 0) {
        const last = holders[holders.length - 1];
        // Comparar timestamps como strings (ISO o HH:MM:SS, ambos ordenan bien lexicográficamente)
        if (!latestTime || last.time > latestTime) {
          latestTime   = last.time;
          latestHolder = last;
          latestItem   = item;
        }
      }
    });

    const panel    = document.getElementById('last-drop-float');
    const imgEl    = document.getElementById('ldf-img');
    const nameEl   = document.getElementById('ldf-item-name');
    const holderEl = document.getElementById('ldf-holder-name');

    if (!latestItem || !latestHolder) return;

    const newImg  = `${IMG_BASE}/${latestItem.item_id}.png`;
    const changed = imgEl.src !== newImg || holderEl.textContent !== latestHolder.name;

    imgEl.src          = newImg;
    imgEl.style.opacity = '1';
    nameEl.textContent = getItemName(latestItem.item_id, latestItem.name);
    holderEl.textContent = latestHolder.name;

    panel.classList.add('visible');
    if (changed) {
      panel.classList.remove('pop');
      void panel.offsetWidth; // reflow para reiniciar animación
      panel.classList.add('pop');
    }
  }

  // URL raw del Gist (funciona solo con Gists PÚBLICOS, sin autenticación)
  const GIST_RAW_BOX  = `https://gist.githubusercontent.com/raw/${GIST_ID}/ro_box_tracker.json`;

  function pollBoxTracker() {
    fetch(GIST_RAW_BOX + '?t=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        if (data) renderBoxTracker(data);
      })
      .catch(e => console.log("Error leyendo Gist:", e));
  }

  // === MODAL: MOSTRAR PERSONAJES ===
  function showHolders(itemId, itemName, imgSrc, holders) {
    document.getElementById('modal-item-img').src   = imgSrc;
    document.getElementById('modal-item-name').textContent = itemName;
    document.getElementById('modal-item-sub').textContent  = `#${itemId}`;

    const body    = document.getElementById('modal-body');
    const summary = document.getElementById('modal-summary');
    body.innerHTML = '';

    const arr = holders || [];
    if (arr.length === 0) {
      body.innerHTML = '<div class="modal-empty">Nadie ha obtenido este ítem aún.</div>';
      summary.innerHTML = '';
    } else {
      // Del más reciente al más antiguo
      [...arr].reverse().forEach(h => {
        const initial = (h.name || '?')[0].toUpperCase();
        const row = document.createElement('div');
        row.className = 'holder-row';
        row.innerHTML = `
          <div class="holder-name">
            <div class="holder-avatar">${esc(initial)}</div>
            ${esc(h.name)}
          </div>
          <div class="holder-time">${esc(h.time)}</div>`;
        body.appendChild(row);
      });
      summary.innerHTML = `Total: <span>${arr.length}</span> ${arr.length === 1 ? 'obtención' : 'obtenciones'}`;
    }

    document.getElementById('holders-modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('holders-modal').classList.remove('active');
  }

  function handleOverlayClick(e) {
    // Cerrar si se hace click en el fondo pero no dentro de la card
    if (e.target === document.getElementById('holders-modal')) closeModal();
  }

  // Tecla ESC para cerrar modal
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // === STATUS ===
  function pollStatus() {
    document.getElementById('status-dot').classList.add('on');
    document.getElementById('status-text').textContent = 'GitHub Sync Mode';
  }

  // Init
  pollBoxTracker();
  pollStatus();
  setInterval(pollBoxTracker, 90000); // Cada 90 seg (Python sube cada 60 seg)
</script>
</body>
</html>
